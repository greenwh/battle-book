<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 38">
  <defs>
    <linearGradient id="iceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0f8ff"/>
      <stop offset="45%"  stop-color="#a8dff5"/>
      <stop offset="100%" stop-color="#5cc4e8"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6ecf9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ghost: dome + wavy 3-bump base, centered x=40 -->
  <g transform="translate(29.5,1.24) scale(0.878)" filter="url(#glow)">
    <path d="M12,2 C7.58,2 4,5.58 4,10 L4,20.5 C4,20.9 4.5,21.1 4.8,20.8 L6.8,18.8 L8.8,20.8 C9.1,21.1 9.6,21.1 9.9,20.8 L12,18.7 L14.1,20.8 C14.4,21.1 14.9,21.1 15.2,20.8 L17.2,18.8 L19.2,20.8 C19.5,21.1 20,20.9 20,20.5 L20,10 C20,5.58 16.42,2 12,2 Z"
          fill="url(#ghostGrad)"/>
    <circle cx="9.3" cy="10.5" r="1.3" fill="#0d0f14"/>
    <circle cx="14.7" cy="10.5" r="1.3" fill="#0d0f14"/>
  </g>

  <!-- pha in Georgia serif with ice gradient -->
  <text x="40" y="34"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        font-weight="bold"
        letter-spacing="3"
        fill="url(#iceGrad)"
        filter="url(#glow)">pha</text>
</svg>
